<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Image Processing Web App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto 30px auto;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-weight: 600;
            color: #555;
        }
        input[type="file"], select, button {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        .image-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .image-box {
            flex: 1;
            min-width: 280px;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .image-box img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 6px;
            margin-top: 10px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Digital Image Processing Application</h1>

        <form action="/" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="file">Select Image:</label>
                <input type="file" id="file" name="file" accept="image/*" required>
            </div>

            <div class="form-group">
                <label for="operation">Select DIP Operation:</label>
                <select id="operation" name="operation" required>
                    <option value="grayscale">Grayscale</option>
                    <option value="blur">Gaussian Blur</option>
                    <option value="canny">Canny Edge Detection</option>
                </select>
            </div>

            <button type="submit">Process Image</button>
        </form>

        {% if original_image or processed_image %}
        <div class="image-container">
            {% if original_image %}
            <div class="image-box">
                <h3>Original Image</h3>
                <img src="{{ url_for('static', filename='uploads/' + original_image) }}" alt="Original Image">
            </div>
            {% endif %}

            {% if processed_image %}
            <div class="image-box">
                <h3>Processed Image</h3>
                <img src="{{ url_for('static', filename='processed/' + processed_image) }}" alt="Processed Image">
            </div>
            {% endif %}
        </div>
        {% endif %}
    </div>

</body>
</html>
